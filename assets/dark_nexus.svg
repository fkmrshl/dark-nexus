<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a0a10" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4a0a10" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4a0a10" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#640010" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#640010" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="overlay"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="320" fill="#070707"/>
  <rect width="1024" height="320" stroke="#111111" stroke-width="1" fill="none"/>
  <rect width="1024" height="320" fill="url(#bg2)"/>
  <rect width="1024" height="320" fill="#888" filter="url(#noise)" opacity="0.015"/>

  <!-- Eyebrow -->
  <text x="512" y="52"
        text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#2e2e2e" letter-spacing="5">network intelligence framework</text>

  <!-- DARK -->
  <text x="512" y="138"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="78" font-weight="800"
        fill="#e0e0e0" letter-spacing="-2">DARK</text>

  <!-- NEXUS (blood red) -->
  <text x="512" y="218"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="78" font-weight="800"
        fill="#6b0f18" letter-spacing="-2">NEXUS</text>

  <!-- Underline -->
  <rect x="312" y="226" width="400" height="1" fill="url(#ul)"/>

  <!-- Description -->
  <text x="512" y="268"
        text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#3a3a3a" letter-spacing="0.2">
    <tspan fill="#4a4a4a">Modular C++ framework</tspan> for network reconnaissance and infrastructure analysis.
  </text>
</svg>