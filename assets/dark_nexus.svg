import base64

with open('/tmp/node_modules/@fontsource/syne/files/syne-latin-800-normal.woff2', 'rb') as f:
    syne = base64.b64encode(f.read()).decode('ascii')

with open('/tmp/node_modules/@fontsource/dm-mono/files/dm-mono-latin-400-normal.woff2', 'rb') as f:
    dmmono = base64.b64encode(f.read()).decode('ascii')

svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @font-face {{
        font-family: 'Syne';
        font-weight: 800;
        src: url('data:font/woff2;base64,{syne}') format('woff2');
      }}
      @font-face {{
        font-family: 'DM Mono';
        font-weight: 400;
        src: url('data:font/woff2;base64,{dmmono}') format('woff2');
      }}
    </style>
    <linearGradient id="ul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a0a10" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4a0a10" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4a0a10" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#640010" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#640010" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="overlay"/>
    </filter>
  </defs>

  <rect width="1024" height="320" fill="#070707"/>
  <rect width="1024" height="320" stroke="#111111" stroke-width="1" fill="none"/>
  <rect width="1024" height="320" fill="url(#bg2)"/>
  <rect width="1024" height="320" fill="#888" filter="url(#noise)" opacity="0.018"/>

  <!-- eyebrow -->
  <text x="512" y="58"
    text-anchor="middle"
    font-family="DM Mono, Courier New, monospace"
    font-size="9" fill="#2e2e2e" letter-spacing="5">network intelligence framework</text>

  <!-- DARK -->
  <text x="512" y="148"
    text-anchor="middle"
    font-family="Syne, Arial Black, sans-serif"
    font-size="80" font-weight="800"
    fill="#e0e0e0" letter-spacing="-2">DARK</text>

  <!-- NEXUS -->
  <text x="512" y="228"
    text-anchor="middle"
    font-family="Syne, Arial Black, sans-serif"
    font-size="80" font-weight="800"
    fill="#6b0f18" letter-spacing="-2">NEXUS</text>

  <!-- underline -->
  <rect x="312" y="236" width="400" height="1" fill="url(#ul)"/>

  <!-- description -->
  <text x="512" y="272"
    text-anchor="middle"
    font-family="DM Mono, Courier New, monospace"
    font-size="12" fill="#3a3a3a" letter-spacing="0.2">
    <tspan fill="#4a4a4a">Modular C++ framework</tspan> for network reconnaissance and infrastructure analysis.</text>

</svg>'''

with open('/mnt/user-data/outputs/banner.svg', 'w', encoding='utf-8') as f:
    f.write(svg)

print(f"Done. {len(svg.encode())} bytes")
