<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a0a10" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4a0a10" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4a0a10" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#640010" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#640010" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="overlay"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="300" fill="#070707"/>
  <rect width="1024" height="300" stroke="#111111" stroke-width="1" fill="none"/>
  <rect width="1024" height="300" fill="url(#bg2)"/>
  <rect width="1024" height="300" fill="#888" filter="url(#noise)" opacity="0.012"/>

  <!-- Eyebrow -->
  <text x="512" y="46"
        text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16" fill="#5a5a5a" letter-spacing="7">network intelligence framework</text>

  <!-- DARK -->
  <text x="512" y="126"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="86" font-weight="800"
        fill="#e0e0e0" letter-spacing="-2.5">DARK</text>

  <!-- NEXUS -->
  <text x="512" y="198"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="86" font-weight="800"
        fill="#6b0f18" letter-spacing="-2.5">NEXUS</text>

  <!-- Underline -->
  <rect x="280" y="208" width="464" height="1.5" fill="url(#ul)"/>

  <!-- Description -->
  <text x="512" y="252"
        text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14.5" fill="#555555" letter-spacing="0.3">
    <tspan fill="#5f5f5f">Modular C++ framework</tspan> for network reconnaissance and infrastructure analysis.
  </text>
</svg>
