name: Hide Flag With Noise
on: push
jobs:
  spam_commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dark_nexus_CTF_challenge
          fetch-depth: 0
      - name: Create 15 automated commits
        run: |
          git config --global user.name "fkmrshl"
          git config --global user.email "your-email@example.com"
          for i in {1..15}; do
            echo "Noise build log entry $i" >> changelog_noise.txt
            git add changelog_noise.txt
            git commit -m "Code optimization and refactoring (patch $i)"
          done
          git push origin dark_nexus_CTF_challenge
